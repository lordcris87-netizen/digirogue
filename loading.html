<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a3d">
<title>DigiRogue · Portal del Mundo Digital</title>
<style>
:root{color-scheme:dark;--cyan:#63e6e8;--gold:#ffe27b;--ink:#061523}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102a3d;color:#fff;font-family:ui-monospace,"Courier New",monospace}
#wallpaper{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;filter:brightness(.62) saturate(1.08)}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,#07152633,#06152252 54%,#061522a6);pointer-events:none}
.portal-glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 52%,#58ddf01c,transparent 58%);animation:glow 3s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{to{opacity:.52;transform:scale(1.03)}}
#panel{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 34px));padding:clamp(24px,5vw,52px) clamp(20px,6vw,64px);text-align:center;background:linear-gradient(135deg,#0a2035f5,#112e47f2);border:3px solid #7cecf0;box-shadow:0 0 0 5px #071522b8,0 0 38px #4be0e666,inset 0 0 0 2px #d9ffff2b}
.eyebrow{font-size:clamp(10px,1.4vw,13px);letter-spacing:.18em;color:#9df9f0;font-weight:900}
h1{margin:20px 0 8px;color:#fff;font-size:clamp(30px,6vw,54px);letter-spacing:.14em;text-shadow:3px 3px 0 #07121e,-2px -2px 0 #07121e,0 0 18px #67e8ed88}
.place{margin:0 0 26px;color:var(--gold);font-size:clamp(13px,2vw,18px);font-weight:900;letter-spacing:.16em;text-shadow:2px 2px #111}
#message{min-height:22px;margin:0 0 16px;font-weight:800;font-size:clamp(13px,1.8vw,16px);color:#f4fbff}
.track{height:25px;padding:4px;background:#061422;border:2px solid #74ebed;box-shadow:0 0 12px #42e1e580}
#bar{height:100%;width:0;background:repeating-linear-gradient(90deg,#ffe27b 0 18px,#fff0a8 18px 24px);box-shadow:0 0 12px #ffe27b;transition:width .14s linear}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:#a9d7e8;font-size:clamp(9px,1.2vw,12px);font-weight:900;letter-spacing:.1em}
#percent{color:var(--gold)}
#friends{position:fixed;left:0;right:0;bottom:clamp(8px,3vh,28px);display:flex;justify-content:center;align-items:flex-end;gap:clamp(24px,8vw,110px);pointer-events:none}
.friend{width:clamp(76px,11vw,132px);height:clamp(76px,11vw,132px);object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 8px 10px #061522aa);animation:hop 1.1s steps(2,end) infinite}
.friend:nth-child(2){animation-delay:-.27s}.friend:nth-child(3){animation-delay:-.54s}.friend:nth-child(4){animation-delay:-.81s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
.footer{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:9px;font-weight:900;letter-spacing:.2em;color:#d7f7f5a8;pointer-events:none}
@media(max-height:520px){#panel{top:43%;padding:14px 24px}h1{margin:8px 0 4px}.place{margin-bottom:10px}#friends{bottom:4px}.friend{width:64px;height:64px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:4s!important;transition:none!important}}
</style>
</head>
<body>
<img id="wallpaper" src="assets/launcher/DigitalWorld_clearing.png" alt="">
<div class="shade"></div><div class="portal-glow"></div>
<main id="panel" aria-live="polite">
<div class="eyebrow">✦ PORTAL DEL MUNDO DIGITAL ✦</div>
<h1>DIGIROGUE</h1>
<p class="place">BOSQUE DEL COMIENZO</p>
<p id="message">Preparando el portal y reuniendo a tus compañeros…</p>
<div class="track" role="progressbar" aria-label="Carga del juego" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
<div class="meta"><span>PREPARANDO A TUS COMPAÑEROS</span><b id="percent">0%</b></div>
</main>
<div id="friends" aria-hidden="true">
<img class="friend" src="assets/launcher/digimon/agumon.png" alt="">
<img class="friend" src="assets/launcher/digimon/gabumon.png" alt="">
<img class="friend" src="assets/launcher/digimon/patamon.png" alt="">
<img class="friend" src="assets/launcher/digimon/koromon.png" alt="">
</div>
<div class="footer">UN NUEVO MUNDO · UN EQUIPO · UNA AVENTURA</div>
<script>
(()=>{const bar=document.getElementById('bar'),percent=document.getElementById('percent'),track=document.querySelector('[role=progressbar]'),message=document.getElementById('message'),start=performance.now(),minMs=5200,maxMs=8500,imgs=[...document.images];let loaded=0;
 const mark=()=>{loaded++;};imgs.forEach(img=>{if(img.complete)mark();else{img.addEventListener('load',mark,{once:true});img.addEventListener('error',mark,{once:true})}});
 function step(now){const elapsed=now-start,ready=loaded>=imgs.length,limit=ready?minMs:maxMs,p=Math.min(96,Math.floor(elapsed/limit*96));bar.style.width=p+'%';percent.textContent=p+'%';track.setAttribute('aria-valuenow',String(p));message.textContent=p<35?'Abriendo el portal al Mundo Digital…':p<72?'Reuniendo a tus compañeros…':'El Bosque del Comienzo ya casi está listo…';
 if(elapsed>=minMs&&ready){bar.style.width='100%';percent.textContent='100%';track.setAttribute('aria-valuenow','100');message.textContent='¡Agumon te espera!';setTimeout(()=>location.replace('game.html?fromPortal=1'),650);return}
 if(elapsed>=maxMs){bar.style.width='100%';percent.textContent='100%';track.setAttribute('aria-valuenow','100');message.textContent='¡El portal está abierto!';setTimeout(()=>location.replace('game.html?fromPortal=1'),650);return}
 requestAnimationFrame(step)}
 requestAnimationFrame(step)})();
</script>
</body>
</html>
