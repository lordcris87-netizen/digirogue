name: DigiRogue development checks
on:
  push:
    branches:
      - develop/portada-animada
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Server Python syntax
        run: python -m py_compile server.py
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from subprocess import run
          for name in ('index.html', 'preview-animations.html'):
              text = Path(name).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
              assert scripts, f'No inline JS: {name}'
              for i, script in enumerate(scripts):
                  temp = Path(f'/tmp/digirogue_{i}.js')
                  temp.write_text(script, encoding='utf-8')
                  run(['node', '--check', str(temp)], check=True)
          PY
