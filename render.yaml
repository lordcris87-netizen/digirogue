
services:
  - type: web
    name: digirogue-online
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: DIGIROGUE_DB
        value: /tmp/digirogue-ranking.sqlite3
      - key: PYTHONUNBUFFERED
        value: '1'
